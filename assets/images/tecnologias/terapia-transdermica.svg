<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <rect width="600" height="380" fill="#0f0f11" />
  <!-- Infusão Molecular e Otimização Celular -->
  <g transform="translate(180, 50)">
    <!-- Frasco Clínico / Ampola de Micronutrientes Nobres -->
    <rect x="90" y="50" width="60" height="130" rx="8" fill="#1b1d24" stroke="#D5C2A0" stroke-width="1.5" />
    <rect x="105" y="30" width="30" height="20" rx="3" fill="#A88B54" />
    <!-- Líquido com Brilho Champagne -->
    <rect x="94" y="90" width="52" height="84" rx="4" fill="rgba(213, 194, 160, 0.25)" />
    <!-- Gotículas / Partículas Moleculares em Suspensão -->
    <circle cx="120" cy="115" r="4" fill="#D5C2A0" />
    <circle cx="130" cy="140" r="3" fill="#D5C2A0" />
    <circle cx="110" cy="150" r="5" fill="#D5C2A0" />
    <!-- Matriz Transdérmica / Camadas Dérmicas -->
    <line x1="20" y1="210" x2="220" y2="210" stroke="#333" stroke-width="2" />
    <line x1="20" y1="225" x2="220" y2="225" stroke="#444" stroke-width="1.5" stroke-dasharray="6 3" />
    <line x1="20" y1="240" x2="220" y2="240" stroke="#555" stroke-width="1" />
  </g>
  <!-- Legenda -->
  <rect x="130" y="315" width="340" height="32" rx="16" fill="#15171e" stroke="rgba(213, 194, 160, 0.3)" />
  <text x="300" y="335" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#D5C2A0" text-anchor="middle">TERAPIA TRANSDÉRMICA &amp; NUTRACÊUTICA</text>
</svg>
