<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <rect width="600" height="380" fill="#151413" />
  <radialGradient id="deskGlow" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#D5C2A0" stop-opacity="0.25" />
    <stop offset="100%" stop-color="#151413" stop-opacity="0" />
  </radialGradient>
  <rect width="600" height="380" fill="url(#deskGlow)" />
  <!-- Mesa de Atendimento Médico Minimalista -->
  <rect x="140" y="210" width="320" height="120" rx="4" fill="#24211e" stroke="#3d3730" stroke-width="1.5" />
  <line x1="140" y1="212" x2="460" y2="212" stroke="#D5C2A0" stroke-width="2" />
  <!-- Poltronas Ergonômicas em Couro Nobre -->
  <rect x="70" y="190" width="80" height="130" rx="10" fill="#2d2924" stroke="#4a4237" />
  <rect x="450" y="190" width="80" height="130" rx="10" fill="#2d2924" stroke="#4a4237" />
  <!-- Monitor de Diagnóstico Metabólico -->
  <rect x="230" y="140" width="140" height="85" rx="3" fill="#0f0f11" stroke="#555" />
  <rect x="240" y="150" width="120" height="65" fill="#1a1c22" />
  <polyline points="250,190 275,170 300,185 325,160 350,175" fill="none" stroke="#D5C2A0" stroke-width="2" />
  <!-- Legenda -->
  <rect x="200" y="320" width="200" height="28" rx="14" fill="#0c0c0c" stroke="rgba(213, 194, 160, 0.3)" />
  <text x="300" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="1.5" fill="#D5C2A0" text-anchor="middle">SUÍTE DE CONSULTA MÉDICA</text>
</svg>
